<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary Results - AI Study Assistant</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav>
        <h1>AI Study Assistant</h1>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="history.html">History</a>
            <button id="logout-btn">Logout</button>
        </div>
    </nav>

    <main>
        <div class="container">
            <div class="result-header">
                <h2 id="result-title">Summary Results</h2>
                <div class="action-buttons">
                    <button id="copy-btn" class="btn btn-secondary">Copy All</button>
                    <button id="export-txt-btn" class="btn btn-secondary">Export TXT</button>
                    <button id="export-pdf-btn" class="btn btn-secondary">Export PDF</button>
                    <button id="new-summary-btn" class="btn btn-primary">New Summary</button>
                </div>
            </div>

            <!-- Summary Section -->
            <section class="summary-section">
                <h3>📝 Summary</h3>
                <div id="summary-content" class="content-box">
                    <!-- Summary will be displayed here -->
                </div>
            </section>

            <!-- Flashcards Section -->
            <section class="flashcards-section">
                <h3>🃏 Flashcards</h3>
                <div class="flashcards-controls">
                    <button id="quiz-mode-btn" class="btn btn-accent">Start Quiz Mode</button>
                    <span id="card-counter">0 / 0</span>
                </div>
                <div id="flashcards-container">
                    <!-- Flashcards will be displayed here -->
                </div>
            </section>

            <!-- Quiz Mode (Hidden by default) -->
            <section id="quiz-section" class="quiz-section" style="display: none;">
                <h3>🎯 Quiz Mode</h3>
                <div class="quiz-card">
                    <div class="quiz-question" id="quiz-question">
                        <!-- Question will appear here -->
                    </div>
                    <div class="quiz-answer" id="quiz-answer" style="display: none;">
                        <!-- Answer will appear here -->
                    </div>
                    <div class="quiz-controls">
                        <button id="show-answer-btn" class="btn btn-primary">Show Answer</button>
                        <button id="next-card-btn" class="btn btn-secondary" style="display: none;">Next Card</button>
                        <button id="end-quiz-btn" class="btn btn-secondary">End Quiz</button>
                    </div>
                    <div class="quiz-progress">
                        <span id="quiz-progress-text">Card 1 of 5</span>
                        <div class="progress-bar">
                            <div id="progress-fill" class="progress-fill"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/generate.js"></script>
</body>
</html>
