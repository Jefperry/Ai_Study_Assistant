<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summary History - AI Study Assistant</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <nav>
      <h1>AI Study Assistant</h1>
      <div class="nav-links">
        <a href="index.html">Dashboard</a>
        <a href="history.html" class="active">History</a>
        <button id="logout-btn">Logout</button>
      </div>
    </nav>

    <main>
      <div class="container">
        <h2>Your Study Summaries</h2>

        <!-- Search and Filter Section -->
        <div class="search-section">
          <input
            type="text"
            id="search-input"
            placeholder="Search summaries..."
          />
          <select id="sort-select">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="title">Title A-Z</option>
          </select>
        </div>

        <!-- Summaries List -->
        <div id="history-container">
          <div id="summaries-list">
            <!-- Summaries will be loaded here dynamically -->
            <p class="loading">Loading your summaries...</p>
          </div>

          <!-- Pagination -->
          <div id="pagination-container">
            <!-- Pagination controls will be added here -->
          </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" style="display: none">
          <h3>No summaries yet</h3>
          <p>Start by creating your first summary!</p>
          <a href="index.html" class="btn btn-primary">Create Summary</a>
        </div>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/history.js"></script>
  </body>
</html>
